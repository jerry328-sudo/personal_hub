<script>
const themeStorageKey='personal-hub-theme';
const themeOptions=['dark','light','system'];
let themeMode='system';
try{const savedTheme=localStorage.getItem(themeStorageKey);if(themeOptions.includes(savedTheme))themeMode=savedTheme}catch{}
const systemTheme=window.matchMedia('(prefers-color-scheme: dark)');
function applyTheme(){document.documentElement.dataset.theme=themeMode==='system'?(systemTheme.matches?'dark':'light'):themeMode}
function setThemeMode(mode){if(!themeOptions.includes(mode))return;themeMode=mode;applyTheme();try{localStorage.setItem(themeStorageKey,mode)}catch{}}
systemTheme.addEventListener('change',()=>{if(themeMode==='system')applyTheme()});
applyTheme();
</script>

/* Theme preference is independent of the sample data. */
:root{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--bg:#171d1a;--sidebar:#111713;--text:#dce7df;--muted:#a0b1a6;--line:#303d34;--green:#86c8a3;--tint:#263c2f;--red:#efa29a}

:root[data-theme="dark"] .btn.primary:hover{background:#a0d7b8}

:root[data-theme="dark"] .nav-item.active{background:var(--tint);color:#b4e1c7}

:root[data-theme="dark"] .entry:not(.active):after{background:var(--line)}

    modal(img.name,`<img class="image-large" src="${esc(imageSrc(img))}" alt="${esc(img.name)}"><p style="margin:15px 0 0">模板示例图片。正式服务从私有 R2 经 Worker 鉴权后加载。</p>`);$('#modal').classList.add('image-dialog')
  }else if(action==='preview-upload'){
    modal('添加示例图片',`<p>选择本地图片，预览正文中的显示效果。模板仅在当前浏览器保存，不会上传到 R2。添加后生成一个示例新版本，完成状态保持不变。</p><label class="field">图片文件<input type="file" id="preview-file" data-entry="${id}" accept="image/png,image/jpeg,image/webp,image/gif"><small>模板限 1 MiB；正式服务设计为 10 MiB。PNG、JPEG、WebP 或 GIF。</small></label><div class="dialog-actions"><button class="btn" data-action="close-modal">取消</button></div>`)
  }
});
document.addEventListener('change',async event=>{
  const el=event.target;
  if(el.id==='theme-mode')setThemeMode(el.value);
  if(el.dataset.completeEntry)setCompleted(el.dataset.completeEntry,el.checked);
  if(el.id==='completion-filter'){completionFilter=el.value;renderEntries()}
  if(el.dataset.modeAgent){const a=getAgent(el.dataset.modeAgent);a.displayMode=el.value;save();expandedEntry=null;selectedVersion=null;selected=null;filter='all';query='';$('#app').classList.remove('reading');render()}
  if(el.id==='report-entry'){selected=el.value;selectedVersion=null;renderBoard()}
  if(el.id==='preview-file'){
    const file=el.files?.[0],entryId=el.dataset.entry;if(!file)return;
    if(!['image/png','image/jpeg','image/webp','image/gif'].includes(file.type)||file.size>1024*1024){toast('请选择不超过 1 MiB 的 PNG、JPEG、WebP 或 GIF');return}
    try{
      const src=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsDataURL(file)});
      const e=data.entries.find(x=>x.id===entryId);if(!e){toast('条目已不存在');return}
      const v=structuredClone(e.versions.at(-1));v.v=latest(e)+1;v.images=[...(v.images||[]),{id:'local-'+Date.now(),src,name:file.name,caption:'本地图片预览 · 尚未上传 R2'}];v.note='新版本增加了图片，原有完成状态保留。';
      const stamp=new Date();e.versions.push(v);e.day=stamp.toLocaleDateString('sv-SE');e.time=stamp.toLocaleTimeString('zh-CN',{hour:'2-digit',minute:'2-digit'});
      save();selected=e.id;selectedVersion=v.v;expandedEntry=e.id;$('#modal').close();render();toast('已生成含图片的示例新版本')
    }catch{toast('图片读取失败，请重新选择')}
  }
});
document.addEventListener('input',event=>{
  if(event.target.id==='board-search'){const pos=event.target.selectionStart;query=event.target.value;renderBoard();const input=$('#board-search');input.focus();try{input.setSelectionRange(pos,pos)}catch{}}
});
document.addEventListener('error',event=>{if(event.target instanceof HTMLImageElement){const message=document.createElement('span');message.className='image-error';message.textContent=(event.target.alt||'图片')+' · 图片暂不可用';event.target.replaceWith(message)}},true);
render();
</script></body></html>
